name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK to a stable filename
        run: cp app/build/outputs/apk/debug/*.apk yer-alti-tarayici-debug.apk

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: geoscanner-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to a public release (no login required to download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: "GeoScanner Android (debug) — en son otomatik derleme"
          body: |
            Bu, `android-native/` içindeki en son koddan otomatik olarak üretilen
            imzasız (debug) bir Android APK'sıdır. Bu link her zaman en güncel
            derlemeyi gösterir — aşağıdaki `.apk` dosyasına dokunup indirin,
            giriş yapmanıza gerek yoktur.
          files: android-native/yer-alti-tarayici-debug.apk
          make_latest: "true"
