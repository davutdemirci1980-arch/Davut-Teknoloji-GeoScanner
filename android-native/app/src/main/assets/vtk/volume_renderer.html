// Color map
function jet(t){
    t=Math.max(0,Math.min(1,t));
    if(t<0.25) return new THREE.Color(0,4*t,1);
    if(t<0.5) return new THREE.Color(0,1,1-4*(t-0.25));
    if(t<0.75) return new THREE.Color(4*(t-0.5),1,0);
    return new THREE.Color(1,1-4*(t-0.75),0);
}

// Rainbow2: Kırmızı→Beyaz, Mavi→Siyah (ters kontrast)
function rainbow2(t){
    t=Math.max(0,Math.min(1,t));
    if(t<0.2){
        // Siyah → Koyu mavi
        var f=t/0.2;
        return new THREE.Color(0,0,f*0.3);
    } else if(t<0.4){
        // Koyu mavi → Mavi-mor
        var f=(t-0.2)/0.2;
        return new THREE.Color(f*0.2,0,0.3+f*0.4);
    } else if(t<0.6){
        // Mavi-mor → Gri
        var f=(t-0.4)/0.2;
        return new THREE.Color(0.2+f*0.4,f*0.4,0.7-f*0.3);
    } else if(t<0.8){
        // Gri → Açık pembe
        var f=(t-0.6)/0.2;
        return new THREE.Color(0.6+f*0.3,0.4+f*0.3,0.4+f*0.3);
    } else {
        // Açık pembe → Beyaz
        var f=(t-0.8)/0.2;
        return new THREE.Color(0.9+f*0.1,0.7+f*0.3,0.7+f*0.3);
    }
}

// Rainbow1: Standart gokkusagi - mor,mavi,cyan,yesil,sari,turuncu,kirmizi
function rainbow1(t){
    t=Math.max(0,Math.min(1,t));
    if(t<0.143){
        var f=t/0.143;
        return new THREE.Color(0.5*(1-f),0,0.5+0.5*f); // mor->mavi
    } else if(t<0.286){
        var f=(t-0.143)/0.143;
        return new THREE.Color(0,f,1); // mavi->cyan
    } else if(t<0.429){
        var f=(t-0.286)/0.143;
        return new THREE.Color(0,1,1-f); // cyan->yesil
    } else if(t<0.571){
        var f=(t-0.429)/0.143;
        return new THREE.Color(f,1,0); // yesil->sari
    } else if(t<0.714){
        var f=(t-0.571)/0.143;
        return new THREE.Color(1,1-f*0.5,0); // sari->turuncu
    } else if(t<0.857){
        var f=(t-0.714)/0.143;
        return new THREE.Color(1,0.5-0.5*f,0); // turuncu->kirmizi
    } else {
        var f=(t-0.857)/0.143;
        return new THREE.Color(1,0,f*0.3); // kirmizi->koyu kirmizi
    }
}

function getColor(t){
    if(currentColorMap==='rainbow1') return rainbow1(t);
    if(currentColorMap==='rainbow2') return rainbow2(t);
    return jet(t);
}

function init(){
    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020210);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);

    // Renderer
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Lights
    var ambient = new THREE.AmbientLight(0x404040, 0.6);
    scene.add(ambient);
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(2,3,4);

    scene.add(dirLight2);

    // Groups
    scatterGroup = new THREE.Group(); scene.add(scatterGroup);
    isoGroup = new THREE.Group(); scene.add(isoGroup);
    volumeGroup = new THREE.Group(); scene.add(volumeGroup);
    hfGroup = new THREE.Group(); scene.add(hfGroup);
    contourGroup = new THREE.Group(); scene.add(contourGroup);
    boxGroup = new THREE.Group(); scene.add(boxGroup);
    axesGroup = new THREE.Group(); scene.add(axesGroup);
    gradientGroup = new THREE.Group(); scene.add(gradientGroup);
    streamGroup = new THREE.Group(); scene.add(streamGroup);
    sliceGroup = new THREE.Group(); scene.add(sliceGroup);
    signalMapGroup = new THREE.Group(); scene.add(signalMapGroup);
    gridOverlayGroup = new THREE.Group(); scene.add(gridOverlayGroup);

    buildBox();
    buildAxes();
    setupTouch();

    document.getElementById('loading').classList.add('hidden');
    if(window.Android && window.Android.onVtkReady) window.Android.onVtkReady();

    animate();
}

function updateCamera(){
    var ex = camDist*Math.sin(rotY)*Math.cos(rotX) + panX;
    var ey = camDist*Math.sin(rotX) + panY;
    var ez = camDist*Math.cos(rotY)*Math.cos(rotX);
    camera.position.set(ex, ey, ez);
    camera.lookAt(panX, panY, 0);
}

function animate(){
    requestAnimationFrame(animate);
    if(autoRotating) { rotY+=0.008; updateCamera(); }

    scatterGroup.visible = showScatter;
    isoGroup.visible = showIso;
    volumeGroup.visible = showVolume;
    hfGroup.visible = showHF;
    contourGroup.visible = showContours;
    boxGroup.visible = showBox;
    axesGroup.visible = showAxes;
    gradientGroup.visible = showGradient;
    streamGroup.visible = showStream;
    sliceGroup.visible = showSlice;
    signalMapGroup.visible = showSignalMap;
    gridOverlayGroup.visible = showGridOverlay;

    // Slice animation
    if(sliceAnimRunning){
        sliceAnimFrame+=sliceAnimSpeed*0.02;
        if(sliceAnimFrame>1) sliceAnimFrame=0;
        updateSlicePlane(sliceAnimFrame);
    }

    renderer.render(scene, camera);
}

// ================================================================
// TOUCH CONTROLS - 360 DEGREE
// ================================================================
function setupTouch(){
    var el = renderer.domElement;

    el.addEventListener('touchstart', function(e){
        e.preventDefault();
        if(e.touches.length===1){
            isDragging=true; touchMode='rotate';
            prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
        } else if(e.touches.length===2){
            isDragging=true; touchMode='pinch';
            var dx=e.touches[1].clientX-e.touches[0].clientX;
            var dy=e.touches[1].clientY-e.touches[0].clientY;
            pinchDist=Math.sqrt(dx*dx+dy*dy);
            prevX=(e.touches[0].clientX+e.touches[1].clientX)/2;
            prevY=(e.touches[0].clientY+e.touches[1].clientY)/2;
        }
    },{passive:false});

    el.addEventListener('touchmove', function(e){
        e.preventDefault();
        if(!isDragging) return;
        if(e.touches.length===1 && touchMode==='rotate'){
            var dx=e.touches[0].clientX-prevX, dy=e.touches[0].clientY-prevY;
            rotY += dx*0.008;
            rotX += dy*0.008;
            prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
            updateCamera();
        } else if(e.touches.length===2 && touchMode==='pinch'){
            var dx=e.touches[1].clientX-e.touches[0].clientX;
            var dy=e.touches[1].clientY-e.touches[0].clientY;
            var d=Math.sqrt(dx*dx+dy*dy);
            camDist *= pinchDist/d;
            camDist=Math.max(0.5,Math.min(15,camDist));
            pinchDist=d;
            var cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
            var cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
            panX+=(cx-prevX)*0.003; panY-=(cy-prevY)*0.003;
            prevX=cx; prevY=cy;
            updateCamera();
        }
    },{passive:false});

    el.addEventListener('touchend', function(e){
        e.preventDefault();
        if(e.touches.length===0) isDragging=false;
        else if(e.touches.length===1){
            touchMode='rotate'; prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
        }
    },{passive:false});

    // Mouse
    el.addEventListener('mousedown',function(e){isDragging=true;touchMode=e.button===2?'pan':'rotate';prevX=e.clientX;prevY=e.clientY;});
    el.addEventListener('mousemove',function(e){if(!isDragging)return;var dx=e.clientX-prevX,dy=e.clientY-prevY;if(touchMode==='rotate'){rotY+=dx*0.005;rotX+=dy*0.005;}else{panX+=dx*0.003;panY-=dy*0.003;}prevX=e.clientX;prevY=e.clientY;updateCamera();});
    el.addEventListener('mouseup',function(){isDragging=false;});
    el.addEventListener('wheel',function(e){camDist*=e.deltaY>0?1.1:0.9;camDist=Math.max(0.5,Math.min(15,camDist));updateCamera();});
    el.addEventListener('contextmenu',function(e){e.preventDefault();});

    window.addEventListener('resize',function(){
        camera.aspect=window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
    });
}

// ================================================================
// BOX & AXES
// ================================================================
function buildBox(){
    clearGroup(boxGroup);
    var geo = new THREE.BoxGeometry(2,2,2);
    var edges = new THREE.EdgesGeometry(geo);
    var mat = new THREE.LineBasicMaterial({color:0x4466aa, linewidth:1});
    boxGroup.add(new THREE.LineSegments(edges, mat));
}

function buildAxes(){
    clearGroup(axesGroup);
    var L=1.4;
    // X axis - red
    addLine(axesGroup, [0,0,0],[L,0,0], 0xff4444);
    // Y axis - green
    addLine(axesGroup, [0,0,0],[0,L,0], 0x44ff44);
    // Z axis - blue
    addLine(axesGroup, [0,0,0],[0,0,L], 0x4488ff);
}

function addLine(group, from, to, color){
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([from[0],from[1],from[2],to[0],to[1],to[2]],3));
    group.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color:color})));
}

function clearGroup(g){
    while(g.children.length>0){
        var c=g.children[0];
        if(c.geometry) c.geometry.dispose();
        if(c.material) c.material.dispose();
        g.remove(c);
    }
}

// ================================================================
// DATA PROCESSING
// ================================================================
function processGridData(){
    if(!gridData||gridCols===0||gridRows===0) return;
    console.log('processGridData: '+gridCols+'x'+gridRows+' len='+gridData.length);

    dataMinC=Infinity; dataMaxC=-Infinity;
    for(var i=0;i<gridData.length;i++){
        if(gridData[i]<dataMinC) dataMinC=gridData[i];
        if(gridData[i]>dataMaxC) dataMaxC=gridData[i];
    }
    dataRangeC=dataMaxC-dataMinC; if(dataRangeC===0) dataRangeC=1;

    // Build 3D volume
    volX=gridCols; volY=gridRows; volZ=Math.max(10, Math.min(20, Math.round((gridCols+gridRows)/2)));
    volumeData=new Uint8Array(volX*volY*volZ);
    for(var gy=0;gy<gridRows;gy++){
        for(var gx=0;gx<gridCols;gx++){
            var val=(gridData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            for(var gz=0;gz<volZ;gz++){
                var zN=gz/(volZ-1);
                var g=Math.exp(-0.5*Math.pow((zN-0.35)/0.25,2));
                volumeData[gz*volX*volY+gy*volX+gx]=Math.round(Math.max(0,Math.min(255,val*g*255)));
            }
        }
    }

    buildScatter();
    buildIso();
    buildVolPoints();
    buildHF();
    buildContourLines();
    autoFitCamera();
    updateInfo();
    console.log('processGridData complete');
}

function autoFitCamera(){
    var maxDim = Math.max(gridCols, gridRows, volZ);
    if(maxDim<=8) camDist=3.2;
    else if(maxDim<=15) camDist=3.8;
    else if(maxDim<=25) camDist=4.5;
    else camDist=5.5;
    rotX=-0.35; rotY=0.6; panX=0; panY=0;
    updateCamera();
}

var sphereGeoCache=null;

function makeValueLabel(text, color, labelScale){
    var canvas = document.createElement('canvas');
    canvas.width=256; canvas.height=96;
    var ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,256,96);
    // Arka plan (yarı saydam siyah)
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(10,10,236,76);
    // Metin
    ctx.font='bold 48px Arial, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeStyle='#000'; ctx.lineWidth=5;
    ctx.strokeText(text,128,48);
    ctx.fillStyle=color;
    ctx.fillText(text,128,48);
    var tex=new THREE.CanvasTexture(canvas);
    tex.minFilter=THREE.LinearFilter;
    tex.needsUpdate=true;
    var mat=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, sizeAttenuation:true});
    var sprite=new THREE.Sprite(mat);
    var w=labelScale*0.5;
    sprite.scale.set(w, w*0.375, 1);
    return sprite;
}

function buildScatter(){
    clearGroup(scatterGroup);
    if(!gridData) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);
    var totalPts=gridCols*gridRows;

    // Küre ve etiket boyutunu grid boyutuna göre ayarla
    var sphereRadius=0.06;
    var labelScale=0.5;
    if(totalPts>30){ sphereRadius=0.05; labelScale=0.45; }
    if(totalPts>80){ sphereRadius=0.04; labelScale=0.38; }
    if(totalPts>200){ sphereRadius=0.03; labelScale=0.30; }
    if(totalPts>500){ sphereRadius=0.025; labelScale=0.25; }

    // Tek bir SphereGeometry paylaş (performans)
    if(!sphereGeoCache || sphereGeoCache._radius!==sphereRadius){
        sphereGeoCache=new THREE.SphereGeometry(sphereRadius,16,12);
        sphereGeoCache._radius=sphereRadius;
    }

    for(var gy=0;gy<gridRows;gy++){
        for(var gx=0;gx<gridCols;gx++){
            var rawVal=gridData[gy*gridCols+gx];
            var val=(rawVal-dataMinC)/dataRangeC;
            var x=(gx/cDiv)*2-1;
            var y=val*1.6-0.8;
            var z=-((gy/rDiv)*2-1);
            var c=getColor(val);

            // Yuvarlak küre
            var sphereMat=new THREE.MeshPhongMaterial({
                color:new THREE.Color(c.r,c.g,c.b),
                shininess:80,
                specular:new THREE.Color(0.3,0.3,0.3)
            });
            var sphere=new THREE.Mesh(sphereGeoCache, sphereMat);
            sphere.position.set(x,y,z);
            scatterGroup.add(sphere);

            // Sayısal değer etiketi - her kürenin üstünde
            var txt;
            if(Math.abs(rawVal)>=1000) txt=Math.round(rawVal).toString();
            else if(Math.abs(rawVal)>=100) txt=Math.round(rawVal).toString();
            else if(Math.abs(rawVal)>=10) txt=rawVal.toFixed(1);
            else txt=rawVal.toFixed(2);
            var hexColor='#'+((1<<24)+(Math.round(c.r*255)<<16)+(Math.round(c.g*255)<<8)+Math.round(c.b*255)).toString(16).slice(1);
            var label=makeValueLabel(txt, hexColor, labelScale);
            label.position.set(x, y+sphereRadius+labelScale*0.12, z);
            scatterGroup.add(label);
        }
    }
}

                    var cz=[z,z,z,z,z+1,z+1,z+1,z+1];

                    var ev=[];
                    for(var e=0;e<12;e++){
                        if(edge&(1<<e)){
                            var a=EP[e][0],b=EP[e][1];
                            var t=(iso-vv[a])/(vv[b]-vv[a]||1);
                            t=Math.max(0,Math.min(1,t));
                            ev[e]=[(cx[a]+(cx[b]-cx[a])*t)/(volX-1)*2-1,
                                   (cz[a]+(cz[b]-cz[a])*t)/(volZ-1)*2-1,
                                   -((cy[a]+(cy[b]-cy[a])*t)/(volY-1)*2-1)];
                        }
                    }

                    var tri=MC_TRI[ci];
                    if(!tri) continue;
                    for(var ti=0;ti<tri.length;ti+=3){
                        var p0=ev[tri[ti]],p1=ev[tri[ti+1]],p2=ev[tri[ti+2]];
                        if(!p0||!p1||!p2) continue;
                        // Normal
                        var ax=p1[0]-p0[0],ay=p1[1]-p0[1],az=p1[2]-p0[2];
                        var bx=p2[0]-p0[0],by=p2[1]-p0[1],bz=p2[2]-p0[2];
                        var nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
                        var nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
                        nx/=nl;ny/=nl;nz/=nl;
                        positions.push(p0[0],p0[1],p0[2], p1[0],p1[1],p1[2], p2[0],p2[1],p2[2]);
                        normals.push(nx,ny,nz, nx,ny,nz, nx,ny,nz);
                    }
                }
            }
        }

        if(positions.length>0){
            var geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
            geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals,3));
            var mat = new THREE.MeshPhongMaterial({
                color: new THREE.Color(col[0],col[1],col[2]),
                transparent:true, opacity:0.7, side:THREE.DoubleSide,
                shininess:30, flatShading:false
            });
            isoGroup.add(new THREE.Mesh(geo, mat));
        }
    }
    updateInfo();
}

// VOLUME RENDERING - Yarı saydam dilim katmanları

function buildVolPoints(){
    clearGroup(volumeGroup);
    if(!volumeData) return;
    var xDiv=Math.max(volX-1,1), yDiv=Math.max(volY-1,1), zDiv=Math.max(volZ-1,1);

    // Her Z dilimi için yarı saydam yüzey oluştur
    var sliceStep=Math.max(1, Math.floor(volZ/16)); // Max 16 dilim performans için
    for(var z=0;z<volZ;z+=sliceStep){
        var positions=[], colors=[], alphas=[];
        var hasData=false;
        for(var y=0;y<volY-1;y++){
            for(var x=0;x<volX-1;x++){
                var v00=volumeData[z*volX*volY+y*volX+x]/255;
                var v10=volumeData[z*volX*volY+y*volX+x+1]/255;
                var v01=volumeData[z*volX*volY+(y+1)*volX+x]/255;
                var v11=volumeData[z*volX*volY+(y+1)*volX+x+1]/255;
                var avg=(v00+v10+v01+v11)/4;
                if(avg<0.05) continue; // Boş voxel atla
                hasData=true;
                var x0=(x/xDiv)*2-1, x1=((x+1)/xDiv)*2-1;
                var zPos=(z/zDiv)*2-1;
                var y0=-((y/yDiv)*2-1), y1=-(((y+1)/yDiv)*2-1);
                // Tri 1
                positions.push(x0,zPos,y0, x1,zPos,y0, x0,zPos,y1);
                // Tri 2
                positions.push(x1,zPos,y0, x1,zPos,y1, x0,zPos,y1);
                var c00=getColor(v00),c10=getColor(v10),c01=getColor(v01),c11=getColor(v11);
                colors.push(c00.r,c00.g,c00.b, c10.r,c10.g,c10.b, c01.r,c01.g,c01.b);
                colors.push(c10.r,c10.g,c10.b, c11.r,c11.g,c11.b, c01.r,c01.g,c01.b);
            }
        }
        if(hasData && positions.length>0){
            var geo=new THREE.BufferGeometry();
            geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
            geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
            var mat=new THREE.MeshBasicMaterial({
                vertexColors:true, transparent:true,
                opacity:volumeOpacity*0.3, side:THREE.DoubleSide,
                depthWrite:false, blending:THREE.AdditiveBlending
            });
            volumeGroup.add(new THREE.Mesh(geo,mat));
        }
    }

    // Ayrıca yüksek değerli voxelleri küre olarak göster
    var sphereGeo=new THREE.SphereGeometry(0.04,8,6);
    var vStep=Math.max(1,Math.floor(Math.max(volX,volY,volZ)/12));
    for(var z=0;z<volZ;z+=vStep){
        for(var y=0;y<volY;y+=vStep){
            for(var x=0;x<volX;x+=vStep){
                var val=volumeData[z*volX*volY+y*volX+x]/255;
                if(val<0.3) continue;
                var px=(x/xDiv)*2-1, py=(z/zDiv)*2-1, pz=-((y/yDiv)*2-1);
                var c=getColor(val);
                var mat=new THREE.MeshPhongMaterial({color:new THREE.Color(c.r,c.g,c.b),transparent:true,opacity:val*volumeOpacity});
                var mesh=new THREE.Mesh(sphereGeo,mat);
                mesh.position.set(px,py,pz);
                volumeGroup.add(mesh);
            }
        }
    }
}

function buildHF(){
    clearGroup(hfGroup);
    if(!gridData||gridCols<2||gridRows<2) return;
    var positions=[], colors=[], normals=[];
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);

    for(var gy=0;gy<gridRows-1;gy++){
        for(var gx=0;gx<gridCols-1;gx++){
            var n00=(gridData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            var n10=(gridData[gy*gridCols+gx+1]-dataMinC)/dataRangeC;
            var n01=(gridData[(gy+1)*gridCols+gx]-dataMinC)/dataRangeC;
            var n11=(gridData[(gy+1)*gridCols+gx+1]-dataMinC)/dataRangeC;
            var x0=(gx/cDiv)*2-1, x1=((gx+1)/cDiv)*2-1;
            var z0=-((gy/rDiv)*2-1), z1=-(((gy+1)/rDiv)*2-1);

            // Tri 1
            pushTriHF(positions,colors,normals, x0,n00*hfWarp*2-1,z0, x1,n10*hfWarp*2-1,z0, x0,n01*hfWarp*2-1,z1, n00,n10,n01);
            // Tri 2
            pushTriHF(positions,colors,normals, x1,n10*hfWarp*2-1,z0, x1,n11*hfWarp*2-1,z1, x0,n01*hfWarp*2-1,z1, n10,n11,n01);
        }
    }
    if(positions.length>0){
        var geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals,3));
        var mat = new THREE.MeshPhongMaterial({vertexColors:true, transparent:true, opacity:hfOpacity, side:THREE.DoubleSide, shininess:20});
        hfGroup.add(new THREE.Mesh(geo, mat));
    }
}

function pushTriHF(P,C,N, x0,y0,z0, x1,y1,z1, x2,y2,z2, v0,v1,v2){
    P.push(x0,y0,z0, x1,y1,z1, x2,y2,z2);
    var c0=getColor(v0),c1=getColor(v1),c2=getColor(v2);
    C.push(c0.r,c0.g,c0.b, c1.r,c1.g,c1.b, c2.r,c2.g,c2.b);
    var ax=x1-x0,ay=y1-y0,az=z1-z0, bx=x2-x0,by=y2-y0,bz=z2-z0;
    var nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
    var nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1; nx/=nl;ny/=nl;nz/=nl;
    N.push(nx,ny,nz, nx,ny,nz, nx,ny,nz);
}

// ================================================================
// CONTOUR LINES - Anomali bazlı dinamik kontur
// ================================================================
var contourFilterCode='none';
var contourAnomalyMode=true; // Anomali bölgelerinde kalınlaş ve renk değiş

function buildContourLines(){
    clearGroup(contourGroup);
    if(!gridData||gridCols<2||gridRows<2) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);

    // Filtre uygulanmış veri kullan
    var useData=gridData;
    if(contourFilterCode!=='none'){
        useData=applyJSFilter(gridData, gridCols, gridRows, contourFilterCode);
    }

    // Anomali tespiti için istatistik hesapla
    var mean=0, std=0;
    for(var i=0;i<useData.length;i++) mean+=useData[i];
    mean/=useData.length;
    for(var i=0;i<useData.length;i++) std+=(useData[i]-mean)*(useData[i]-mean);
    std=Math.sqrt(std/useData.length);
    var anomalyThLow=mean+std*1.0;  // Orta anomali
    var anomalyThHigh=mean+std*2.0; // Güçlü anomali

    // Kontur dolgu yüzeyi (filled contours)
    var fillPositions=[], fillColors=[];
    for(var gy=0;gy<gridRows-1;gy++){
        for(var gx=0;gx<gridCols-1;gx++){
            var n00=(useData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            var n10=(useData[gy*gridCols+gx+1]-dataMinC)/dataRangeC;
            var n01=(useData[(gy+1)*gridCols+gx]-dataMinC)/dataRangeC;
            var n11=(useData[(gy+1)*gridCols+gx+1]-dataMinC)/dataRangeC;
            var x0=(gx/cDiv)*2-1, x1=((gx+1)/cDiv)*2-1;
            var z0=-((gy/rDiv)*2-1), z1=-(((gy+1)/rDiv)*2-1);
            var yOff=contourOffset*2-1;
            var avg=(n00+n10+n01+n11)/4;
            var c=getColor(avg);
            // Anomali bölgesinde opasite artır
            var rawAvg=(useData[gy*gridCols+gx]+useData[gy*gridCols+gx+1]+useData[(gy+1)*gridCols+gx]+useData[(gy+1)*gridCols+gx+1])/4;
            var isAnomaly=rawAvg>anomalyThLow;
            if(isAnomaly || avg>0.4){
                fillPositions.push(x0,yOff,z0, x1,yOff,z0, x0,yOff,z1);
                fillPositions.push(x1,yOff,z0, x1,yOff,z1, x0,yOff,z1);
                var alpha=isAnomaly?(rawAvg>anomalyThHigh?0.6:0.35):0.15;
                fillColors.push(c.r*alpha,c.g*alpha,c.b*alpha, c.r*alpha,c.g*alpha,c.b*alpha, c.r*alpha,c.g*alpha,c.b*alpha);
                fillColors.push(c.r*alpha,c.g*alpha,c.b*alpha, c.r*alpha,c.g*alpha,c.b*alpha, c.r*alpha,c.g*alpha,c.b*alpha);
            }
        }
    }
    if(fillPositions.length>0){
        var fGeo=new THREE.BufferGeometry();
        fGeo.setAttribute('position',new THREE.Float32BufferAttribute(fillPositions,3));
        fGeo.setAttribute('color',new THREE.Float32BufferAttribute(fillColors,3));
        contourGroup.add(new THREE.Mesh(fGeo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.8,side:THREE.DoubleSide})));
    }

    // Kontur çizgileri
    for(var lv=0;lv<contourLevels;lv++){
        var iso=(lv+0.5)/contourLevels;
        var cc=getColor(iso);
        var positions=[];

        for(var gy=0;gy<gridRows-1;gy++){
            for(var gx=0;gx<gridCols-1;gx++){
                var n00=(useData[gy*gridCols+gx]-dataMinC)/dataRangeC;
                var n10=(useData[gy*gridCols+gx+1]-dataMinC)/dataRangeC;
                var n01=(useData[(gy+1)*gridCols+gx]-dataMinC)/dataRangeC;
                var n11=(useData[(gy+1)*gridCols+gx+1]-dataMinC)/dataRangeC;
                var x0=(gx/cDiv)*2-1, x1=((gx+1)/cDiv)*2-1;
                var z0=-((gy/rDiv)*2-1), z1=-(((gy+1)/rDiv)*2-1);
                var yOff=contourOffset*2-1;
                var cr=[];
                if((n00>=iso)!==(n10>=iso)){var t=(iso-n00)/(n10-n00);cr.push([x0+t*(x1-x0),yOff,z0]);}
                if((n10>=iso)!==(n11>=iso)){var t=(iso-n10)/(n11-n10);cr.push([x1,yOff,z0+t*(z1-z0)]);}
                if((n01>=iso)!==(n11>=iso)){var t=(iso-n01)/(n11-n01);cr.push([x0+t*(x1-x0),yOff,z1]);}
                if((n00>=iso)!==(n01>=iso)){var t=(iso-n00)/(n01-n00);cr.push([x0,yOff,z0+t*(z1-z0)]);}
                if(cr.length>=2) positions.push(cr[0][0],cr[0][1],cr[0][2],cr[1][0],cr[1][1],cr[1][2]);
                if(cr.length>=4) positions.push(cr[2][0],cr[2][1],cr[2][2],cr[3][0],cr[3][1],cr[3][2]);
            }
        }
        if(positions.length>0){
            // Anomali bölgelerinde farklı renk: yüksek iso = anomali
            var lineColor=cc;
            if(contourAnomalyMode && iso>0.6){
                lineColor=new THREE.Color(1,0.1,0.1); // Kırmızı anomali
            } else if(contourAnomalyMode && iso>0.4){
                lineColor=new THREE.Color(1,0.8,0); // Sarı orta
            }
            var geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
            var mat = new THREE.LineBasicMaterial({color:lineColor, linewidth:iso>0.6?2:1});
            contourGroup.add(new THREE.LineSegments(geo, mat));
        }
    }

    // Anomali merkez noktalarını işaretle
    if(contourAnomalyMode){
        for(var gy=1;gy<gridRows-1;gy++){
            for(var gx=1;gx<gridCols-1;gx++){
                var val=useData[gy*gridCols+gx];
                if(val>anomalyThHigh){
                    var x=(gx/cDiv)*2-1, z=-((gy/rDiv)*2-1);
                    var yOff=contourOffset*2-1;
                    var ringGeo=new THREE.RingGeometry(0.03,0.06,16);
                    var ringMat=new THREE.MeshBasicMaterial({color:0xff0000,side:THREE.DoubleSide,transparent:true,opacity:0.9});
                    var ring=new THREE.Mesh(ringGeo,ringMat);
                    ring.position.set(x,yOff+0.01,z);
                    ring.rotation.x=-Math.PI/2;
                    contourGroup.add(ring);
                }
            }
        }
    }

    // === DUVARLAR - kullanici acip kapatabilir ===
    if(contourWallLeft) buildWallContour(useData, gridCols, gridRows, cDiv, rDiv, dataMinC, dataRangeC, 'left');
    if(contourWallRight) buildWallContour(useData, gridCols, gridRows, cDiv, rDiv, dataMinC, dataRangeC, 'right');
    if(contourWallBack) buildWallContour(useData, gridCols, gridRows, cDiv, rDiv, dataMinC, dataRangeC, 'back');
    if(contourWallFront) buildWallContour(useData, gridCols, gridRows, cDiv, rDiv, dataMinC, dataRangeC, 'front');

    // === CSV ANOMALI ALGILAMA ===
    csvAnomalyRegions=[];
    for(var gy=1;gy<gridRows-1;gy++){
        for(var gx=1;gx<gridCols-1;gx++){
            var val=useData[gy*gridCols+gx];
            if(val>anomalyThHigh){
                var x=(gx/cDiv)*2-1, z=-((gy/rDiv)*2-1);
                csvAnomalyRegions.push({x:gx,y:gy,val:val,nx:x,nz:z,sigma:(val-mean)/std});
            }
        }
    }
    // Anomali bolgelerinde 3D isaretci
    for(var a=0;a<csvAnomalyRegions.length;a++){
        var ar=csvAnomalyRegions[a];
        var yOff=contourOffset*2-1;
        // Dikey cizgi - anomali noktasindan yukari
        var lineGeo=new THREE.BufferGeometry();
        lineGeo.setAttribute('position',new THREE.Float32BufferAttribute([ar.nx,yOff,ar.nz, ar.nx,yOff+0.5,ar.nz],3));
        contourGroup.add(new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({color:0xff0000,linewidth:2})));
        // Ust noktada kucuk kure
        var sGeo=new THREE.SphereGeometry(0.025,8,6);
        var sMat=new THREE.MeshBasicMaterial({color:0xff4444});
        var sMesh=new THREE.Mesh(sGeo,sMat);
        sMesh.position.set(ar.nx,yOff+0.52,ar.nz);
        contourGroup.add(sMesh);
    }
}

function buildWallContour(useData, cols, rows, cDiv, rDiv, dMin, dRange, side){
    var nSlices=12;
    // Her duvar icin ayri grup
    var wallGroup=new THREE.Group();
    wallGroup.name='wall_'+side;

    if(side==='left' || side==='right'){
        var colIdx = (side==='left') ? 0 : cols-1;
        var xW = (side==='left') ? -1.02 : 1.02;
        // Duvar yuzey mesh
        for(var gy=0;gy<rows-1;gy++){
            var n0=Math.max(0,Math.min(1,(useData[gy*cols+colIdx]-dMin)/dRange));
            var n1=Math.max(0,Math.min(1,(useData[(gy+1)*cols+colIdx]-dMin)/dRange));
            var z0=-((gy/rDiv)*2-1), z1=-(((gy+1)/rDiv)*2-1);
            for(var gz=0;gz<nSlices-1;gz++){
                var y0=(gz/(nSlices-1))*2-1, y1=((gz+1)/(nSlices-1))*2-1;
                var zFrac=gz/(nSlices-1);
                var val=n0*(1-zFrac)+0.5*zFrac; // Yukari dogru azal
                var c=getColor(val);
                var geo=new THREE.PlaneGeometry(Math.abs(z1-z0),Math.abs(y1-y0));
                var mat=new THREE.MeshBasicMaterial({color:new THREE.Color(c.r,c.g,c.b),transparent:true,opacity:val>0.5?0.7:0.4,side:THREE.DoubleSide,depthWrite:false});
                var mesh=new THREE.Mesh(geo,mat);
                mesh.position.set(xW,(y0+y1)/2,(z0+z1)/2);
                mesh.rotation.y=Math.PI/2;
                wallGroup.add(mesh);
            }
        }
        // Contour cizgileri duvar uzerinde
        for(var lv=0;lv<contourLevels;lv++){
            var isoVal=lv/(contourLevels-1);
            var pts=[];
            for(var gy=0;gy<rows;gy++){
                var n=(useData[gy*cols+colIdx]-dMin)/dRange;
                var z=-((gy/rDiv)*2-1);
                var y=isoVal*2-1;
                pts.push(new THREE.Vector3(xW,y,z));
            }
            if(pts.length>1){
                var lGeo=new THREE.BufferGeometry().setFromPoints(pts);
                var lc=getColor(isoVal);
                wallGroup.add(new THREE.Line(lGeo,new THREE.LineBasicMaterial({color:new THREE.Color(lc.r,lc.g,lc.b),linewidth:2})));
            }
        }
    } else {
        var rowIdx = (side==='back') ? 0 : rows-1;
        var zW = (side==='back') ? 1.02 : -1.02;
        for(var gx=0;gx<cols-1;gx++){
            var n0=Math.max(0,Math.min(1,(useData[rowIdx*cols+gx]-dMin)/dRange));
            var n1=Math.max(0,Math.min(1,(useData[rowIdx*cols+gx+1]-dMin)/dRange));
            var x0=(gx/cDiv)*2-1, x1=((gx+1)/cDiv)*2-1;
            for(var gz=0;gz<nSlices-1;gz++){
                var y0=(gz/(nSlices-1))*2-1, y1=((gz+1)/(nSlices-1))*2-1;
                var zFrac=gz/(nSlices-1);
                var val=n0*(1-zFrac)+0.5*zFrac;
                var c=getColor(val);
                var geo=new THREE.PlaneGeometry(Math.abs(x1-x0),Math.abs(y1-y0));
                var mat=new THREE.MeshBasicMaterial({color:new THREE.Color(c.r,c.g,c.b),transparent:true,opacity:val>0.5?0.7:0.4,side:THREE.DoubleSide,depthWrite:false});
                var mesh=new THREE.Mesh(geo,mat);
                mesh.position.set((x0+x1)/2,(y0+y1)/2,zW);
                wallGroup.add(mesh);
            }
        }
        // Contour cizgileri duvar uzerinde
        for(var lv=0;lv<contourLevels;lv++){
            var isoVal=lv/(contourLevels-1);
            var pts=[];
            for(var gx=0;gx<cols;gx++){
                var n=(useData[rowIdx*cols+gx]-dMin)/dRange;
                var x=(gx/cDiv)*2-1;
                var y=isoVal*2-1;
                pts.push(new THREE.Vector3(x,y,zW));
            }
            if(pts.length>1){
                var lGeo=new THREE.BufferGeometry().setFromPoints(pts);
                var lc=getColor(isoVal);
                wallGroup.add(new THREE.Line(lGeo,new THREE.LineBasicMaterial({color:new THREE.Color(lc.r,lc.g,lc.b),linewidth:2})));
            }
        }
    }
    contourGroup.add(wallGroup);
}

// ================================================================
// JS TARAFINDA FİLTRE UYGULAMA (Contours için)
// ================================================================
function applyJSFilter(data, cols, rows, code){
    var out=new Float32Array(data.length);
    // 2D grid'e çevir
    var grid=[];
    for(var r=0;r<rows;r++){
        grid[r]=[];
        for(var c=0;c<cols;c++) grid[r][c]=data[r*cols+c];
    }
    var filtered=grid;
    switch(code){
        case 'gauss': filtered=jsGaussBlur(grid,rows,cols,1.5); break;
        case 'median': filtered=jsMedianFilter(grid,rows,cols,3); break;
        case 'sharpen': filtered=jsSharpen(grid,rows,cols,1.5); break;
        case 'edge': filtered=jsSobelEdge(grid,rows,cols); break;
        case 'rank': filtered=jsRankFilter(grid,rows,cols,3); break;
        case 'histeq': filtered=jsHistEq(grid,rows,cols); break;
        case 'bandpass': filtered=jsBandpass(grid,rows,cols,0.1,0.5); break;
        case 'highpass': filtered=jsHighpass(grid,rows,cols); break;
        case 'lowpass': filtered=jsLowpass(grid,rows,cols); break;
        case 'gradient': filtered=jsGradientMag(grid,rows,cols); break;
        case 'laplacian': filtered=jsLaplacian(grid,rows,cols); break;
        case 'threshold': filtered=jsThreshold(grid,rows,cols); break;
        case 'normalize': filtered=jsNormalize(grid,rows,cols); break;
        case 'detrend': filtered=jsDetrend(grid,rows,cols); break;
    }
    for(var r=0;r<rows;r++)
        for(var c=0;c<cols;c++) out[r*cols+c]=filtered[r][c];
    return out;
}

// --- JS Filtre Fonksiyonları ---
function jsGaussBlur(g,R,C,sigma){
    var k=Math.ceil(sigma*3)*2+1, h=Math.floor(k/2), w=[], ws=0;
    for(var i=0;i<k;i++){for(var j=0;j<k;j++){var v=Math.exp(-((i-h)*(i-h)+(j-h)*(j-h))/(2*sigma*sigma));w.push(v);ws+=v;}}
    for(var i=0;i<w.length;i++) w[i]/=ws;
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++){var s=0;var idx=0;
        for(var di=-h;di<=h;di++){for(var dj=-h;dj<=h;dj++){var ri=Math.max(0,Math.min(R-1,r+di)),ci=Math.max(0,Math.min(C-1,c+dj));s+=g[ri][ci]*w[idx++];}}
        out[r][c]=s;}} return out;
}
function jsMedianFilter(g,R,C,k){
    var h=Math.floor(k/2), out=[];
    for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++){var vals=[];
        for(var di=-h;di<=h;di++){for(var dj=-h;dj<=h;dj++){vals.push(g[Math.max(0,Math.min(R-1,r+di))][Math.max(0,Math.min(C-1,c+dj))]);}}
        vals.sort(function(a,b){return a-b;}); out[r][c]=vals[Math.floor(vals.length/2)];}} return out;
}
function jsSharpen(g,R,C,s){
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++){
        var center=g[r][c],nb=0,cnt=0;
        if(r>0){nb+=g[r-1][c];cnt++;} if(r<R-1){nb+=g[r+1][c];cnt++;}
        if(c>0){nb+=g[r][c-1];cnt++;} if(c<C-1){nb+=g[r][c+1];cnt++;}
        out[r][c]=cnt>0?center+s*(center-nb/cnt):center;}} return out;
}
function jsSobelEdge(g,R,C){
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=0;}
    for(var r=1;r<R-1;r++){for(var c=1;c<C-1;c++){
        var gx=-g[r-1][c-1]+g[r-1][c+1]-2*g[r][c-1]+2*g[r][c+1]-g[r+1][c-1]+g[r+1][c+1];
        var gy=-g[r-1][c-1]-2*g[r-1][c]-g[r-1][c+1]+g[r+1][c-1]+2*g[r+1][c]+g[r+1][c+1];
        out[r][c]=Math.sqrt(gx*gx+gy*gy);}}
    for(var r=0;r<R;r++){out[r][0]=out[r][Math.min(1,C-1)];out[r][C-1]=out[r][Math.max(0,C-2)];}
    for(var c=0;c<C;c++){out[0][c]=out[Math.min(1,R-1)][c];out[R-1][c]=out[Math.max(0,R-2)][c];}
    return out;
}
function jsRankFilter(g,R,C,k){
    var h=Math.floor(k/2), out=[];
    for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++){var cv=g[r][c],total=0,less=0;
        for(var di=-h;di<=h;di++){for(var dj=-h;dj<=h;dj++){total++;if(g[Math.max(0,Math.min(R-1,r+di))][Math.max(0,Math.min(C-1,c+dj))]<cv)less++;}}
        out[r][c]=less/total;}} return out;
}
function jsHistEq(g,R,C){
    var mn=Infinity,mx=-Infinity;
    for(var r=0;r<R;r++) for(var c=0;c<C;c++){if(g[r][c]<mn)mn=g[r][c];if(g[r][c]>mx)mx=g[r][c];}
    var rng=mx-mn; if(rng===0) return g;
    var bins=256, hist=new Array(bins).fill(0);
    for(var r=0;r<R;r++) for(var c=0;c<C;c++){var b=Math.max(0,Math.min(bins-1,Math.floor((g[r][c]-mn)/rng*(bins-1))));hist[b]++;}
    var cdf=new Array(bins); cdf[0]=hist[0]/(R*C);
    for(var i=1;i<bins;i++) cdf[i]=cdf[i-1]+hist[i]/(R*C);
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++){
        var b=Math.max(0,Math.min(bins-1,Math.floor((g[r][c]-mn)/rng*(bins-1))));out[r][c]=mn+cdf[b]*rng;}} return out;
}
function jsBandpass(g,R,C,lo,hi){
    var low=jsGaussBlur(g,R,C,1.0/lo);
    var high=jsGaussBlur(g,R,C,1.0/hi);
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=low[r][c]-high[r][c];} return out;
}
function jsHighpass(g,R,C){
    var low=jsGaussBlur(g,R,C,2.0);
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=g[r][c]-low[r][c];} return out;
}
function jsLowpass(g,R,C){ return jsGaussBlur(g,R,C,2.0); }
function jsGradientMag(g,R,C){
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=0;}
    for(var r=1;r<R-1;r++){for(var c=1;c<C-1;c++){
        var dx=(g[r][c+1]-g[r][c-1])/2, dy=(g[r+1][c]-g[r-1][c])/2;
        out[r][c]=Math.sqrt(dx*dx+dy*dy);}}
    return out;
}
function jsLaplacian(g,R,C){
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=0;}
    for(var r=1;r<R-1;r++){for(var c=1;c<C-1;c++){
        out[r][c]=g[r-1][c]+g[r+1][c]+g[r][c-1]+g[r][c+1]-4*g[r][c];}}
    return out;
}
function jsThreshold(g,R,C){
    var mean=0; for(var r=0;r<R;r++) for(var c=0;c<C;c++) mean+=g[r][c]; mean/=(R*C);
    var std=0; for(var r=0;r<R;r++) for(var c=0;c<C;c++) std+=(g[r][c]-mean)*(g[r][c]-mean); std=Math.sqrt(std/(R*C));
    var th=mean+std;
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=g[r][c]>th?g[r][c]:0;} return out;
}
function jsNormalize(g,R,C){
    var mn=Infinity,mx=-Infinity;
    for(var r=0;r<R;r++) for(var c=0;c<C;c++){if(g[r][c]<mn)mn=g[r][c];if(g[r][c]>mx)mx=g[r][c];}
    var rng=mx-mn; if(rng===0) return g;
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=(g[r][c]-mn)/rng;} return out;
}
function jsDetrend(g,R,C){
    // Lineer trend çıkarma (row ve column ortalamaları)
    var rowMeans=new Array(R).fill(0), colMeans=new Array(C).fill(0), total=0;
    for(var r=0;r<R;r++) for(var c=0;c<C;c++){rowMeans[r]+=g[r][c];colMeans[c]+=g[r][c];total+=g[r][c];}
    for(var r=0;r<R;r++) rowMeans[r]/=C;
    for(var c=0;c<C;c++) colMeans[c]/=R;
    var grandMean=total/(R*C);
    var out=[]; for(var r=0;r<R;r++){out[r]=[];for(var c=0;c<C;c++) out[r][c]=g[r][c]-rowMeans[r]-colMeans[c]+grandMean;} return out;
}

// ================================================================
// GRADIENT ARROWS - Sinyal gradyan ok yönleri
// ================================================================
function buildGradientArrows(){
    clearGroup(gradientGroup);
    if(!gridData||gridCols<2||gridRows<2) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);
    var step=Math.max(1,Math.floor(Math.max(gridCols,gridRows)/10));
    for(var gy=1;gy<gridRows-1;gy+=step){
        for(var gx=1;gx<gridCols-1;gx+=step){
            var dx=(gridData[gy*gridCols+gx+1]-gridData[gy*gridCols+gx-1])/(2*dataRangeC);
            var dy=(gridData[(gy+1)*gridCols+gx]-gridData[(gy-1)*gridCols+gx])/(2*dataRangeC);
            var mag=Math.sqrt(dx*dx+dy*dy);
            if(mag<0.01) continue;
            var x=(gx/cDiv)*2-1, z=-((gy/rDiv)*2-1);
            var val=(gridData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            var y=val*1.6-0.8;
            var len=Math.min(mag*3,0.3);
            var ndx=dx/mag*len, ndy=dy/mag*len;
            var geo=new THREE.BufferGeometry();
            geo.setAttribute('position',new THREE.Float32BufferAttribute([x,y,z, x+ndx,y+0.05,z-ndy],3));
            var c=getColor(val);
            gradientGroup.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:c})));
            // Arrowhead
            var aGeo=new THREE.ConeGeometry(0.02,0.06,4);
            var aMat=new THREE.MeshBasicMaterial({color:c});
            var cone=new THREE.Mesh(aGeo,aMat);
            cone.position.set(x+ndx,y+0.05,z-ndy);
            cone.lookAt(x+ndx*2,y+0.1,z-ndy*2);
            gradientGroup.add(cone);
        }
    }
}

// ================================================================
// STREAMLINES - Akış çizgileri
// ================================================================
function buildStreamlines(){
    clearGroup(streamGroup);
    if(!gridData||gridCols<3||gridRows<3) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);
    var seeds=Math.min(12,Math.max(4,Math.floor(Math.sqrt(gridCols*gridRows)/2)));
    for(var s=0;s<seeds;s++){
        var sx=Math.random()*(gridCols-2)+1, sy=Math.random()*(gridRows-2)+1;
        var pts=[];
        for(var t=0;t<60;t++){
            var gx=Math.floor(sx),gy=Math.floor(sy);
            if(gx<1||gx>=gridCols-1||gy<1||gy>=gridRows-1) break;
            var dx=(gridData[gy*gridCols+gx+1]-gridData[gy*gridCols+gx-1])/2;
            var dy=(gridData[(gy+1)*gridCols+gx]-gridData[(gy-1)*gridCols+gx])/2;
            var mag=Math.sqrt(dx*dx+dy*dy);
            if(mag<0.0001) break;
            sx+=dx/mag*0.5; sy+=dy/mag*0.5;
            var x=(sx/cDiv)*2-1, z=-((sy/rDiv)*2-1);
            var val=(gridData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            pts.push(new THREE.Vector3(x,val*1.6-0.8,z));
        }
        if(pts.length>2){
            var curve=new THREE.CatmullRomCurve3(pts);
            var geo=new THREE.TubeGeometry(curve,pts.length*2,0.008,4,false);
            var c=getColor(Math.random());
            streamGroup.add(new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:c,transparent:true,opacity:0.7})));
        }
    }
}

// ================================================================
// SLICE ANIMATION - Dilim düzlemi
// ================================================================
function updateSlicePlane(pos){
    clearGroup(sliceGroup);
    if(!gridData||gridCols<2||gridRows<2) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);
    var sliceY=pos*2-1;
    var positions=[],colors=[];
    for(var gy=0;gy<gridRows-1;gy++){
        for(var gx=0;gx<gridCols-1;gx++){
            var n00=(gridData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            var n10=(gridData[gy*gridCols+gx+1]-dataMinC)/dataRangeC;
            var n01=(gridData[(gy+1)*gridCols+gx]-dataMinC)/dataRangeC;
            var n11=(gridData[(gy+1)*gridCols+gx+1]-dataMinC)/dataRangeC;
            var x0=(gx/cDiv)*2-1,x1=((gx+1)/cDiv)*2-1;
            var z0=-((gy/rDiv)*2-1),z1=-(((gy+1)/rDiv)*2-1);
            positions.push(x0,sliceY,z0, x1,sliceY,z0, x0,sliceY,z1);
            positions.push(x1,sliceY,z0, x1,sliceY,z1, x0,sliceY,z1);
            var c0=getColor(n00),c1=getColor(n10),c2=getColor(n01),c3=getColor(n11);
            colors.push(c0.r,c0.g,c0.b, c1.r,c1.g,c1.b, c2.r,c2.g,c2.b);
            colors.push(c1.r,c1.g,c1.b, c3.r,c3.g,c3.b, c2.r,c2.g,c2.b);
        }
    }
    if(positions.length>0){
        var geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
        geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
        sliceGroup.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.6,side:THREE.DoubleSide})));
    }
}

// ================================================================
// SIGNAL STRENGTH MAP - Sinyal gücü haritası (zemin düzlemi)
// ================================================================
function buildSignalMap(){
    clearGroup(signalMapGroup);
    if(!gridData||gridCols<2||gridRows<2) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);
    var positions=[],colors=[];
    for(var gy=0;gy<gridRows-1;gy++){
        for(var gx=0;gx<gridCols-1;gx++){
            var n00=(gridData[gy*gridCols+gx]-dataMinC)/dataRangeC;
            var n10=(gridData[gy*gridCols+gx+1]-dataMinC)/dataRangeC;
            var n01=(gridData[(gy+1)*gridCols+gx]-dataMinC)/dataRangeC;
            var n11=(gridData[(gy+1)*gridCols+gx+1]-dataMinC)/dataRangeC;
            var x0=(gx/cDiv)*2-1,x1=((gx+1)/cDiv)*2-1;
            var z0=-((gy/rDiv)*2-1),z1=-(((gy+1)/rDiv)*2-1);
            var y=-1.05; // Küpün altında
            positions.push(x0,y,z0, x1,y,z0, x0,y,z1);
            positions.push(x1,y,z0, x1,y,z1, x0,y,z1);
            var c0=getColor(n00),c1=getColor(n10),c2=getColor(n01),c3=getColor(n11);
            colors.push(c0.r,c0.g,c0.b, c1.r,c1.g,c1.b, c2.r,c2.g,c2.b);
            colors.push(c1.r,c1.g,c1.b, c3.r,c3.g,c3.b, c2.r,c2.g,c2.b);
        }
    }
    if(positions.length>0){
        var geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
        geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
        signalMapGroup.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.8,side:THREE.DoubleSide})));
    }
}

// ================================================================
// GRID OVERLAY - Izgara kaplaması
// ================================================================
function buildGridOverlay(){
    clearGroup(gridOverlayGroup);
    if(!gridData||gridCols<2||gridRows<2) return;
    var cDiv=Math.max(gridCols-1,1), rDiv=Math.max(gridRows-1,1);
    var positions=[];
    var y=-0.99;
    // X çizgileri
    for(var gx=0;gx<gridCols;gx++){
        var x=(gx/cDiv)*2-1;
        positions.push(x,y,1, x,y,-1);
    }
    // Z çizgileri
    for(var gy=0;gy<gridRows;gy++){
        var z=-((gy/rDiv)*2-1);
        positions.push(-1,y,z, 1,y,z);
    }
    if(positions.length>0){
        var geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
        gridOverlayGroup.add(new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x336699,transparent:true,opacity:0.5})));
    }
}

window.addEventListener('load', init);
</script>
